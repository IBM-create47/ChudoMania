<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЧудоМания — Доставка еды</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --accent: #ff6b00; --text: #ffffff; --muted: #a0a0a0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
        h1 { text-align: center; font-size: 2rem; margin: 20px 0; text-transform: uppercase; }
        .filters { display: flex; overflow-x: auto; gap: 10px; padding: 10px 20px; }
        .filter-btn { background: var(--card); color: var(--text); border: 1px solid #333; padding: 10px 20px; border-radius: 50px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: var(--accent); border-color: var(--accent); }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .menu-card { background: var(--card); border-radius: 16px; padding: 20px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 160px; object-fit: cover; border-radius: 12px; margin-bottom: 15px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 15px; }
        .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .card-price { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .add-btn { background: transparent; color: var(--text); border: 1px solid var(--accent); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        
        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; border: none; border-radius: 50px; padding: 15px 25px; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; z-index: 100; }
        .cart-count { background: white; color: var(--accent); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .cart-panel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100vh; background: var(--card); z-index: 201; display: flex; flex-direction: column; transition: right 0.3s; }
        .cart-panel.active { right: 0; }
        .cart-header { padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; }
        .close-cart { background: none; border: none; color: white; font-size: 2rem; cursor: pointer; }
        .cart-items { flex: 1; overflow-y: auto; padding: 20px; }
        .cart-footer { padding: 20px; border-top: 1px solid #333; }
        .checkout-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; }
        .form-input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #444; background: #2a2a2a; color: white; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>ЧудоМания</h1>
    
    <div class="filters" id="filters"></div>
    <main class="menu-grid" id="menu-grid"></main>
    
    <button class="cart-btn" id="open-cart-btn">🛒 Корзина <span class="cart-count" id="cart-count">0</span></button>
    
    <aside class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <h2>Ваш заказ</h2>
            <button class="close-cart" id="close-cart-btn">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span>Итого:</span> <span id="cart-total-price">0 ₽</span>
            </div>
            <button class="checkout-btn" id="checkout-btn">Оформить заказ</button>
            
            <div id="checkout-form" style="display: none; margin-top: 15px;">
                <input type="text" id="client-name" class="form-input" placeholder="Ваше имя">
                <input type="tel" id="client-phone" class="form-input" placeholder="Телефон">
                <input type="text" id="client-address" class="form-input" placeholder="Адрес доставки">
                <button class="checkout-btn" id="submit-order-btn" style="background: #25D366; margin-top: 5px;">Отправить в WhatsApp</button>
            </div>
        </div>
    </aside>

    <script type="module">import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyC5S1msxXkjsyuIzm_VRHjiR87SkdEe-IM",
    authDomain: "chudomania-admin.firebaseapp.com",
    projectId: "chudomania-admin",
    storageBucket: "chudomania-admin.appspot.com",
    messagingSenderId: "676365945710",
    appId: "1:676365945710:web:09cb48ce13463a22c70f7f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let menuData = [];
let cart = JSON.parse(localStorage.getItem('chudomania_cart')) || [];

async function loadMenuFromDB() {
    const querySnapshot = await getDocs(collection(db, "menu"));
    menuData = [];
    querySnapshot.forEach((doc) => {
        menuData.push({ id: doc.id, ...doc.data() });
    });
    renderFilters();
    renderMenu('Все');
    updateCartUI();
}
        function addToCart(id) {
    // Ищем блюдо по ID
    const item = menuData.find(i => i.id === id);
    
    // Если не нашли - выводим ошибку в консоль
    if (!item) {
        console.log("Не найдено блюдо с ID:", id);
        return;
    }

    // Ищем, есть ли уже в корзине
    const inCart = cart.find(i => i.id === id);
    
    if (inCart) {
        inCart.quantity += 1;
    } else {
        cart.push({ ...item, quantity: 1 });
    }
    
    saveCart();
    updateCartUI();
}

function saveCart() { 
    localStorage.setItem('chudomania_cart', JSON.stringify(cart)); 
}

function updateCartUI() {
    const count = cart.reduce((s, i) => s + i.quantity, 0);
    const countEl = document.getElementById('cart-count');
    if (countEl) countEl.textContent = count;
    
    const itemsDiv = document.getElementById('cart-items');
    itemsDiv.innerHTML = '';
    let total = 0;
    
    cart.forEach(i => {
        total += i.price * i.quantity;
        itemsDiv.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${i.title} x${i.quantity}</span> <b>${i.price * i.quantity} ₽</b></div>`;
    });
    
    const totalEl = document.getElementById('cart-total-price');
    if (totalEl) totalEl.textContent = total + ' ₽';
}

                document.getElementById('open-cart-btn').onclick = () => document.getElementById('cart-panel').classList.add('active');
        document.getElementById('close-cart-btn').onclick = () => document.getElementById('cart-panel').classList.remove('active');

        document.getElementById('checkout-btn').onclick = () => {
            document.getElementById('checkout-btn').style.display = 'none';
            document.getElementById('checkout-form').style.display = 'block';
        };

        document.getElementById('submit-order-btn').onclick = () => {
            const name = document.getElementById('client-name').value;
            const phone = document.getElementById('client-phone').value;
            const address = document.getElementById('client-address').value;
            
            if(!name || !phone || !address) return alert('Заполните все поля!');

            let text = `Заказ в ЧудоМании!\nИмя: ${name}\nТел: ${phone}\nАдрес: ${address}\n\nСостав:\n`;
            cart.forEach(i => text += `${i.title} x${i.quantity}\n`);
            
            window.open(`https://wa.me/79323332823?text=${encodeURIComponent(text)}`, '_blank');
            
            cart = [];
            saveCart();
            updateCartUI();
            document.getElementById('cart-panel').classList.remove('active');
            document.getElementById('checkout-btn').style.display = 'block';
            document.getElementById('checkout-form').style.display = 'none';
        };

        loadMenuFromDB();
    </script>
</body>
</html>

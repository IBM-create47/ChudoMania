    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC5S1msxXkjsyuIzm_VRHjiR87SkdEe-IM",
            authDomain: "chudomania-admin.firebaseapp.com",
            projectId: "chudomania-admin",
            storageBucket: "chudomania-admin.appspot.com",
            messagingSenderId: "676365945710",
            appId: "1:676365945710:web:09cb48ce13463a22c70f7f"
        };

        let menuData = [];
        let cart = JSON.parse(localStorage.getItem('chudomania_cart')) || [];
        
        // --- Отрисовка ---
        function renderMenu(category) {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            const filtered = category === 'Все' ? menuData : menuData.filter(i => i.category === category);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                const imgSrc = item.image ? item.image : 'https://via.placeholder.com/280x160/1e1e1e/ff6b00?text=Нет+фото';
                
                card.innerHTML = `
                    <img src="${imgSrc}" class="card-img" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                    <div class="card-bottom">
                        <div class="card-price">${item.price} ₽</div>
                        <button class="add-btn" onclick="addToCart('${item.id}')">В корзину</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderFilters() {
            const filters = document.getElementById('filters');
            const cats = ['Все', ...new Set(menuData.map(i => i.category))];
            filters.innerHTML = '';
            cats.forEach(c => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${c === 'Все' ? 'active' : ''}`;
                btn.textContent = c;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderMenu(c);
                };
                filters.appendChild(btn);
            });
        }

        // --- Корзина ---
        window.addToCart = function(id) {
            const item = menuData.find(i => i.id === id);
            if (!item) return;
            const inCart = cart.find(i => i.id === id);
            if (inCart) inCart.quantity += 1;
            else cart.push({ ...item, quantity: 1 });
            saveCart();
            updateCartUI();
        };

        window.changeQuantity = function(id, change) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                saveCart();
                updateCartUI();
            }
        };

        function saveCart() { localStorage.setItem('chudomania_cart', JSON.stringify(cart)); }

        function updateCartUI() {
            const count = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cart-count').textContent = count;
            const itemsDiv = document.getElementById('cart-items');
            itemsDiv.innerHTML = '';
            let total = 0;
            
            if (cart.length === 0) {
                itemsDiv.innerHTML = '<div style="text-align: center; color: #a0a0a0; margin-top: 20px;">Корзина пока пуста 🍔</div>';
            } else {
                cart.forEach(i => {
                    total += i.price * i.quantity;
                    itemsDiv.innerHTML += `
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px;">
                            <div>
                                <div style="font-weight: 600;">${i.title}</div>
                                <div style="color: #ff6b00; font-size: 0.9rem;">${i.price} ₽</div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 10px; background: #121212; padding: 5px 10px; border-radius: 8px;">
                                <button onclick="changeQuantity('${i.id}', -1)" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;">−</button>
                                <span>${i.quantity}</span>
                                <button onclick="changeQuantity('${i.id}', 1)" style="background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem;">+</button>
                            </div>
                        </div>`;
                });
            }
            document.getElementById('cart-total-price').textContent = total + ' ₽';
        }

        // --- События ---
        document.getElementById('open-cart-btn').onclick = () => document.getElementById('cart-panel').classList.add('active');
        document.getElementById('close-cart-btn').onclick = () => document.getElementById('cart-panel').classList.remove('active');

        document.getElementById('checkout-btn').onclick = () => {
            if (cart.length === 0) return;
            document.getElementById('checkout-btn').style.display = 'none';
            document.getElementById('checkout-form').style.display = 'block';
        };

        document.getElementById('submit-order-btn').onclick = () => {
            const name = document.getElementById('client-name').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const address = document.getElementById('client-address').value.trim();

            if (!name || !phone || !address) return alert('Заполните все поля!');

            let text = `Заказ в ЧудоМании!\nИмя: ${name}\nТел: ${phone}\nАдрес: ${address}\n\nСостав:\n`;
            cart.forEach(i => text += `${i.title} x${i.quantity}\n`);
            
            window.open(`https://wa.me/79323332823?text=${encodeURIComponent(text)}`, '_blank');
            
            cart = [];
            saveCart();
            updateCartUI();
            document.getElementById('checkout-form').style.display = 'none';
            document.getElementById('checkout-btn').style.display = 'block';
            document.getElementById('cart-panel').classList.remove('active');
        };

        // --- Прямая загрузка данных ---
        async function initApp() {
            const projectId = firebaseConfig.projectId;
            const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/menu`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.documents) {
                                        menuData = data.documents.map(doc => {
                        const fields = doc.fields;
                        return {
                            id: doc.name.split('/').pop(),
                            title: fields.title.stringValue,
                            price: parseInt(fields.price.integerValue),
                            category: fields.category.stringValue,
                            image: fields.image ? fields.image.stringValue : ''
                        };
                    });
                }
                renderFilters();
                renderMenu('Все');
                updateCartUI();
            } catch (e) {
                console.error("Ошибка:", e);
                document.getElementById('menu-grid').innerHTML = '<p style="color:white; text-align:center;">Ошибка загрузки меню. Проверьте интернет.</p>';
            }
        }

        initApp();
    </script>
</body>
</html>
